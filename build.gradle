buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7.+' // MixinGradle
        classpath 'org.parchmentmc:librarian:1.+'
    }
}

allprojects {
    apply plugin: 'java-library'
    apply plugin: 'net.minecraftforge.gradle'
    apply plugin: 'org.parchmentmc.librarian.forgegradle'
    apply plugin: 'org.spongepowered.mixin'
    apply plugin: 'maven-publish'

    java.toolchain.languageVersion = JavaLanguageVersion.of(17)

    version = project.mod_version //'0.16-mc1.16.5-forge'

    repositories {
        maven { url = 'https://files.minecraftforge.net/maven' }
        mavenCentral()

        maven { url = 'https://dist.creeper.host/Sponge/maven' }

        maven {
            name "tterrag maven"
            url "https://maven.tterrag.com/"
        }
        maven {
            // CurseMaven: any CurseForge file as curse.maven:<slug>-<projectId>:<fileId>.
            name = 'CurseMaven'
            url = 'https://cursemaven.com'
            content { includeGroup 'curse.maven' }
        }
        maven {
            name "theillusivec4"
            url = "https://maven.theillusivec4.top/"
        }
        maven {
            url = "https://modmaven.dev/"
        }
        maven {
            name "Modding Legacy Maven"
            url "https://maven.moddinglegacy.com/artifactory/modding-legacy/"
        }
    }

    // cursemaven-helper:start
    // Mod dependencies come from CurseForge through CurseMaven (or another public Maven), so anyone can build this mod.
    // To build against a local jar while developing, pass its path: -Ppehkui_jar=path/to/pehkui.jar
    // (or set it in ~/.gradle/gradle.properties). Never commit an override.
    def modDep = { String property, String coordinate ->
        def local = findProperty(property)
        if (local) {
            def localJar = rootProject.file(local)
            if (!localJar.isFile()) throw new GradleException("-P${property}=${local} does not exist")
            return files(localJar)
        }
        return fg.deobf(coordinate)
    }
    // cursemaven-helper:end

    dependencies {
        minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.loader_version}"
        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

        // Pehkui
        api modDep('pehkui_jar', "curse.maven:pehkui-319596:${project.pehkui_fileid}")
        // Twilight Forest
        api modDep('twilightforest_jar', "curse.maven:twilightforest-227639:${project.twilightforest_fileid}")
        // Flywheel
        api modDep('flywheel_jar', "com.jozufozu.flywheel:flywheel-forge-1.18.2:${project.flywheel_version}")
        // Rubidium
        api modDep('rubidium_jar', "curse.maven:rubidium-574856:${project.rubidium_fileid}")
        // Oculus
        api modDep('oculus_jar', "curse.maven:oculus-581495:${project.oculus_fileid}")
        // Curios
        runtimeOnly modDep('curios_jar', "top.theillusivec4.curios:curios-forge:${project.curios_version}")
        compileOnly modDep('curios_api_jar', "top.theillusivec4.curios:curios-forge:${project.curios_version}:api")
        // Tinkers Construct
        api modDep('tconstruct_jar', "curse.maven:tconstruct-74072:${project.tconstruct_fileid}")
        api modDep('mantle_jar', "curse.maven:mantle-74924:${project.mantle_fileid}")
        // Serene Seasons (Disabled: Incompatible unless compat render mode)
        // api modDep('sereneseasons_jar', "curse.maven:sereneseasons-291874:${project.sereneseasons_fileid}")
        // Mekanism
        api modDep('mekanism_jar', "curse.maven:mekanism-268560:${project.mekanism_fileid}")
        // Immersive Engineering
        api modDep('immersiveengineering_jar', "curse.maven:immersiveengineering-231951:${project.immersiveengineering_fileid}")
        // Lucent
        api modDep('lucent_jar', "com.legacy:lucent:${project.lucent_version}")
        // Music Triggers
        api modDep('musictriggers_jar', "curse.maven:musictriggers-518410:${project.musictrigger_fileid}")
        api modDep('impossiblelib_jar', "curse.maven:impossiblelib-661115:${project.impossiblelib_fileid}")
        // Vampirism
        api modDep('vampirism_jar', "curse.maven:vampirism-233029:${project.vampirism_fileid}")
        api modDep('guideapi_jar', "curse.maven:guide-api-village-and-pillage-380771:${project.guideapi_fileid}")
        // AgriCraft
        implementation modDep('agricraft_jar', "curse.maven:agricraft-225635:${project.agricraft_fileid}")
        implementation modDep('infinitylib_jar', "curse.maven:infinitylib-251396:${project.infinitylib_fileid}")

        // Vault Hunters (compat mixins only, not shipped or run in dev)
        compileOnly modDep('the_vault_jar', "curse.maven:vault-hunters-official-mod-458203:${project.the_vault_fileid}")

        compileOnly 'com.demonwav.mcdev:annotations:1.0'
    }

    minecraft {
        mappings channel: 'parchment', version: "${project.mapping_version}-${project.minecraft_version}"
        accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked', '-Xmaxwarns', '10000']
        it.options.release = 17
    }
}

archivesBaseName = project.archives_base_name
group = project.maven_group

minecraft {
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                examplemod {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                examplemod {
                    source sourceSets.main
                }
            }
        }
    }
}


dependencies {
    compileOnly project(":imm_ptl_core")
    compileOnly project(":q_misc_util")

    testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
}
test {
    useJUnitPlatform()
}
compileJava {
    source(project(":imm_ptl_core").sourceSets.main.allSource)
    source(project(":q_misc_util").sourceSets.main.allSource)
}
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(":imm_ptl_core").sourceSets.main.resources
    from project(":q_misc_util").sourceSets.main.resources
}


jar {
    manifest {
        attributes([
                "Specification-Title"     : "Immersive Portals",
                "Specification-Vendor"    : "qouteall",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${project.version}",
                "Implementation-Vendor"   : "qouteall, Nick1st",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    from "LICENSE"

    archiveFileName = "${project.archives_base_name}-${project.mod_version}-mc${project.minecraft_version}-forge.jar"
}
mixin {
    add sourceSets.main, 'mixins.imm_ptl.refmap.json'
    config 'imm_ptl.mixins.json'
    config 'imm_ptl_forge.mixins.json'
    config 'imm_ptl_peripheral.mixins.json'
    config 'imm_ptl_compat.mixins.json'
    config 'q_misc_util.mixins.json'
    debug = false // Using true apparently crashes in dev env
}

// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar')
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
//publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

task printClasspath {
    doLast {
        configurations.compileClasspath.each { println "\""+ (it.toString().replace("\\","/")) + "\"," }
    }
}
